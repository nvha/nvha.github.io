        start_date: 2021-10-01
        end_date: 2026-04-30
        summary: Directed R&D initiatives within ICTLAB focusing on loss-masking transport frameworks, P4 data-plane telemetry, active queue management (AQM), adaptive SDN routing, and wireless sensor networks.
        highlights:
          - Supervised 20+ researchers and secured over $100k in R&D funding.
          - Architected P4 in-band telemetry tracking and dynamic SDN control frameworks.

      - company: Kyushu Institute of Technology
        position: Principal Postdoctoral Researcher & PI
        location: Fukuoka, Japan
        start_date: 2018-04-01
        end_date: 2021-09-30
        summary: Served as Principal Investigator (PI) for two JSPS KAKEN Grants-in-Aid (4.42M JPY).
        highlights:
          - Engineered resilient TCP/NC transport frameworks and dynamic SDN routing control planes.
          - Masked channel losses and prevented TCP timeout degradation under high BER conditions.

      - company: University of Science
        position: Associate Lecturer, Network Administrator & Faculty Registrar
        location: Ho Chi Minh City, Vietnam
        start_date: 2009-09-01
        end_date: 2014-03-31
        summary: Taught telecommunication & computer networking courses while managing departmental L2/L3 infrastructure.
        highlights:
          - Architected an FPGA-based 2x2 MIMO-OFDM SDM Transceiver (400 Mbps) using custom DSP pipelines.
          - Mentored student teams to 2nd place in Cisco NetRiders national competition.

    Projects:
      - name: High-Speed Hardware-in-the-Loop (HITL) Link Emulation
        summary: Architected a multi-vendor HITL emulation system bridging Intel Agilex 5 and Xilinx Kintex UltraScale+ FPGAs over HSMC-XTS and PCIe 3.0x4 interfaces.
        highlights:
          - Designed an ultra-wide 1024-bit datapath operating at 156.25/312.5 MHz (up to 320 Gbps pipeline capacity).
          - Integrated high-throughput PCIe DMA streaming.
        start_date: 2026-04-01
        end_date: 2026-07-30

      - name: Wireless System Emulation - Real-Time AWGN Hardware Generator
        summary: Designed 512-bit wide AXI-Stream datapaths achieving 375MHz+ on Intel Agilex 7 and Xilinx FPGAs.
        highlights:
          - Implemented APB interfaces for dynamic C/C++ SDN software control.
          - Automated TCL synthesis and build flows.
        start_date: 2025-09-01
        end_date: 2026-02-28

      - name: Programmable Data Plane (P4) for Telemetry & Loss Mitigation
        summary: Architected a hop-by-hop multicast packet loss recovery scheme using P4 BMv2 switches and ns-3.
        highlights:
          - Designed a custom 8-byte Control Header with a 40-bit sequence for microsecond-precision in-band telemetry tracking.
        start_date: 2024-01-01
        end_date: 2025-01-31

