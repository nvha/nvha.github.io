      - name:
        keywords: '<img src="/assets/img/skills/cpp_logo.webp" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/sv_logo.jpg" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/python_logo.webp" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/ns-3_logo.png" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/packettracer_logo.webp" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/wireshark_logo.webp" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/Linux_logo.png" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/Quartus_logo.png" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/vivado_logo.png" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/Matlab_logo.png" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/P4_logo.webp" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/openflow_icon.webp" style="height: 28px; vertical-align: middle; margin-right: 8px;"><img src="/assets/img/skills/ryu_logo.png" style="height: 28px; vertical-align: middle; margin-right: 8px;">'
        
    Experience:
      - company: University of Science
        position: Network Systems Researcher & Laboratory Supervisor
        location: Ho Chi Minh City, VN
        start_date: "2021-10"
        end_date: "2026-04"
        summary: Directed major R&D initiatives within ICTLAB, supervised 20+ graduate/undergraduate researchers, co-founded ICTLAB, and secured over $100,000 in competitive funding.
        highlights:
          - "Directed major R&D initiatives within the ICTLAB focusing on high-performance networking, wireless communication, and health sensors, architecting loss-masking transport frameworks, proactive FEC queue management models, and a Fault-Tolerant TDMA Framework for Large Wireless Sensor Networks (LWSNs)."
          - "Led and supervised 20+ graduate and undergraduate researchers, directing thesis projects on P4 data-plane telemetry, active queue management (AQM), adaptive SDN routing optimization/load balancing, and IoT network modeling (including LoRa, NB-IoT, and PLC)."
          - "Co-founded the ICTLAB, designing and delivering advanced curricula for communication systems and sensor networks bridging theoretical routing, transport protocol theory, and DSP principles with FPGA prototyping and ns-3 simulation."
          - "Secured and managed over $100,000 in competitive R&D funding across 7 projects, authoring over 20 international peer-reviewed papers (IEEE/IEICE/Scopus)."

      - company: Kyushu Institute of Technology
        position: Principal Postdoctoral Researcher & PI
        location: Fukuoka, Japan
        start_date: "2018-04"
        end_date: "2021-09"
        summary: Served as Principal Investigator for two JSPS KAKEN Grants-in-Aid totaling 4.42M JPY, leading 3 years of post-doctoral protocol R&D.
        highlights:
          - "Served as Principal Investigator (PI) for two prestigious JSPS KAKEN Grants-in-Aid for IoT reliability and 'self-healing' network projects (Grant IDs: 18H06467 & 20K19785, totaling 4.42M JPY)."
          - "Headed R&D projects to engineer resilient TCP with Network Coding (TCP/NC) transport frameworks and centralized SDN architectures tailored to actively mask lossy transport channels."
          - "Developed high-level software models and discrete-event simulations in C++ and Python to bridge theoretical network capacity algorithms with practical real-time packet processing."
          - "Designed and delivered specialized lectures on SDN architectures, OpenFlow control mechanisms, Ryu controllers, and Mininet for the City College of New York (CCNY)."

      - company: University of Science
        position: Associate Lecturer, Network Administrator & Faculty Registrar
        location: Ho Chi Minh City, VN
        start_date: "2009-09"
        end_date: "2014-03"
        summary: Conducted physical-layer communication research, administered departmental L2/L3 network infrastructure, and served as Faculty Registrar.
        highlights:
          - "Architected an FPGA-Based 2x2 MIMO-OFDM SDM Transceiver achieving 400 Mbps throughput using custom DSP pipelines."
          - "Managed departmental network infrastructure as Administrator, applying hands-on L2/L3 routing (OSPF/BGP), switching, VLAN segmentation, and network security."
          - "Mentored student teams to competitive success, including a 2nd-place national finish in the Cisco NetRiders contest (2013)."
          - "Maintained active certifications as a CCAI (Cisco Certified Academy Instructor) for CCNA/Security and MCSE/MCSA."

    Projects:
      - name: High-Speed Hardware-in-the-Loop (HITL) Link Emulation
        summary: Multi-vendor HITL emulation system bridging Intel Agilex 5 and Xilinx Kintex UltraScale+ FPGAs over HSMC-XTS and PCIe 3.0x4 interfaces.
        start_date: "2026-04"
        end_date: Present
        highlights:
          - "Architected a heterogeneous hardware-in-the-loop (HITL) emulation system bridging Intel Agilex 5 and Xilinx Kintex UltraScale+ FPGAs over multi-vendor interfaces."
          - "Designed an ultra-wide 1024-bit packet processing datapath operating at 156.25 MHz / 312.5 MHz core clock (up to 320 Gbps internal pipeline capacity)."
          - "Engineered host-to-FPGA streaming pipelines via PCIe 3.0x4 DMA, enabling end-to-end packet processing with embedded Network Coding offload logic."

      - name: "Wireless System Emulation: AWGN Hardware Emulator"
        summary: Real-time embedded AWGN hardware generator supporting multi-rates and multi-users with APB control interface.
        start_date: "2025-09"
        end_date: "2026-02"
        highlights:
          - "Designed 512-bit wide AXI-Stream datapaths achieving 375MHz+ on Intel Agilex 7 and Xilinx FPGAs."
          - "Developed control state machines, low-level drivers, and software sweeping SNR from -30 dB to 45 dB with precise real-time configuration."
          - "Facilitated HW/SW co-design via APB master/slave interfaces, providing memory-mapped register access for software validation teams via C drivers."

      - name: Programmable Data Plane (P4) for Monitoring & Loss Mitigation
        summary: Hop-by-hop packet loss recovery scheme for reliable multicast using P4-enabled switches in ns-3 and Mininet.
        start_date: "2024-01"
        end_date: "2025-01"
        highlights:
          - "Achieved a 36% reduction in transfer times under severe link loss via localized data-plane packet recovery."
          - "Engineered a custom 8-byte Control Header featuring a 40-bit Success_Check sequence to track jitter and queue occupancy with microsecond precision."
          - "Implemented data-plane packet buffering via a P4 recirculation port queue for localized retransmissions."

      - name: Fault-Tolerant TDMA Framework for LWSNs & Constellation Networks
        summary: Proactive packet loss recovery framework integrating hop-by-hop FEC / Erasure Coding with TDMA scheduling.
        start_date: "2023-10"
        end_date: "2025-09"
        highlights:
          - "Utilized a 1-step Hill Climbing search algorithm to optimize TDMA timeslots and maintain >99% reliability under aggressive 50% link-loss environments."
          - "Programmed scalable software models in C++ and Python in ns-3 over a 20-mile multi-hop linear topology."

      - name: Self-Healing Dynamic Routing Protocol (SDN-FEDRP)
        summary: Dynamic routing protocol on RYU controller leveraging Depth First Search (DFS) path discovery.
        start_date: "2021-01"
        end_date: "2021-12"
        highlights:
          - "Implemented an automated OpenFlow reallocation mechanism governed by a fairness factor."
          - "Achieved a 7x improvement in load balancing versus standard SDN-OSPF in Mininet."

      - name: TCP with Network Coding (TCP/NC)
        summary: Resilient embedded transport layer state machines and custom ACK generator in C++ for ns-3.
        start_date: "2017-03"
        end_date: "2020-03"
        highlights:
          - "Sustained high goodput (70% of link/70 Mbps) under heavy bi-directional burst conditions while preventing TCP timeouts."
          - "Eliminated tail loss and excessive redundancy bandwidth waste in low-latency networks."
  
