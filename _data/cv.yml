        level: Master
        keywords: "SystemVerilog, Verilog, FPGA (Intel Agilex/Stratix, AMD Xilinx Kintex UltraScale+), Pre/Post-Silicon Validation, Hardware Emulation, HW/SW Co-Design, High-Speed Datapaths (1024-bit / 512-bit AXI-Stream), PCIe 3.0, DMA, SerDes, Ethernet MAC/PHY, APB"

      - name: Network Protocols & Programmable Data Planes
        level: Master
        keywords: "P4 (BMv2 Switch), Software-Defined Networking (SDN / OpenFlow / RYU Controller), Transport Protocols (TCP/IP, UDP, TCP/NC), Active Queue Management (AQM), Loss Masking, Traffic Engineering, In-Band Network Telemetry (INT)"

