cv:
  name: Ha Nguyen
  label: Hardware & Network Systems Architect (Ph.D.)
  location: Phoenix, AZ
  email: nvha.dtvt@gmail.com
  summary: Innovative Hardware Systems Architect & Senior Network Systems Architect with 3+ years of postdoctoral R&D and 5+ years of university research leadership.

  sections:
    education:
      - institution: Kyushu Institute of Technology
        area: Computer Science and Systems Engineering
        degree: Ph.D.
        start_date: 2014
        end_date: 2017
        location: Fukuoka, Japan
        summary: "Dissertation: Studies on Improvement and Application of TCP with Network Coding in Lossy Networks."

      - institution: University of Science
        area: Electronics and Telecommunications Engineering
        degree: M.S. & B.S.
        start_date: 2005
        end_date: 2012
        location: Ho Chi Minh City, Vietnam

    experience:
      - company: University of Science
        position: Network Systems Researcher & Laboratory Supervisor
        location: Ho Chi Minh City, Vietnam
        start_date: 2021-10
        end_date: 2026-04
        highlights:
          - Directed R&D initiatives within ICTLAB focusing on loss-masking transport frameworks, P4 data-plane telemetry, AQM, adaptive SDN routing, and wireless sensor networks. Supervised 20+ researchers and secured $100k+ R&D funding.

      - company: Kyushu Institute of Technology
        position: Principal Postdoctoral Researcher & PI
        location: Fukuoka, Japan
        start_date: 2018-04
        end_date: 2021-09
        highlights:
          - Served as Principal Investigator (PI) for two JSPS KAKEN Grants-in-Aid (4.42M JPY). Engineered resilient TCP/NC transport frameworks and dynamic SDN control planes.

      - company: University of Science
        position: Associate Lecturer, Network Administrator & Faculty Registrar
        location: Ho Chi Minh City, Vietnam
        start_date: 2009-09
        end_date: 2014-03
        highlights:
          - Architected an FPGA-based 2x2 MIMO-OFDM SDM Transceiver (400 Mbps) using custom DSP pipelines. Managed departmental L2/L3 networking infrastructure.

    projects:
      - name: High-Speed Hardware-in-the-Loop (HITL) Link Emulation
        start_date: 2026-04
        end_date: Present
        highlights:
          - Architected multi-vendor HITL emulation bridging Intel Agilex 5 and Xilinx Kintex UltraScale+ FPGAs over HSMC-XTS and PCIe 3.0x4. Designed 1024-bit datapath operating at 156.25/312.5 MHz (320 Gbps capacity).

      - name: Real-Time AWGN Hardware Generator
        start_date: 2025-09
        end_date: 2026-02
        highlights:
          - Designed 512-bit wide AXI-Stream datapaths achieving 375MHz+ on Intel Agilex 7 and Xilinx FPGAs with APB interfaces for dynamic C/C++ SDN software control.

    awards:
      - title: International Conference Best Paper Awards
        date: 2022
        awarder: International Conference Committees
        summary: Recipient of 3 international conference Best Paper Awards (2019, 2020, 2022).

      - title: JSPS KAKEN Grants-in-Aid Principal Investigator
        date: 2020
        awarder: Japan Society for the Promotion of Science (JSPS)
        summary: Awarded 2 competitive research grants totaling 4.42 Million JPY.

    skills:
      - name: Hardware & RTL Design
        keywords: "SystemVerilog, Verilog, FPGA (Intel Agilex/Stratix, AMD Xilinx Kintex UltraScale+), Pre/Post-Silicon Validation, HW Emulation, 1024-bit / 512-bit AXI-Stream, PCIe 3.0, DMA, SerDes, Ethernet MAC/PHY, APB"
      - name: Network Protocols & Data Planes
        keywords: "P4 (BMv2 Switch), SDN / OpenFlow / RYU Controller, TCP/IP, UDP, TCP/NC, AQM, In-Band Network Telemetry (INT)"
      - name: Software & Simulation
        keywords: "C/C++, Python, MATLAB, Simulink, ns-3, Mininet, TCL, Bash, Linux (Embedded/PetaLinux), Vivado, Quartus, ModelSim, Wireshark"
