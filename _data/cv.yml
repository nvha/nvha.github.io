    Experience:
      - company: University of Science
        position: Network Systems Researcher & Laboratory Supervisor
        location: Ho Chi Minh City, VN
        start_date: "2021-10"
        end_date: "2026-04"
        summary: Directed major R&D initiatives within ICTLAB, supervised 20+ graduate/undergraduate researchers, co-founded ICTLAB, and secured over $100,000 in competitive funding.
        highlights:
          - "Directed major R&D initiatives within the ICTLAB focusing on high-performance networking, scale-out transport protocol design, programmable P4 telemetry, and hardware/software co-design."
          - "Architected legacy-transparent middlebox transport proxies and proactive loss-masking queue models, enabling multi-session flow aggregation over heterogeneous networks with zero host OS kernel modifications."
          - "Led and supervised 20+ graduate and undergraduate researchers, directing thesis projects on P4 data-plane telemetry, active queue management (AQM), adaptive SDN routing optimization/load balancing, and IoT network modeling."
          - "Co-founded the ICTLAB, managing full-lifecycle hardware prototyping, C++/ns-3 discrete-event network modeling, and APB/AXI memory-mapped register interface development."
          - "Secured and managed over $100,000 in competitive R&D funding across 7 projects (including VNU-HCM Grant B2023-18-01), authoring over 20 international peer-reviewed papers (IEEE/IEICE/Scopus)."

      - company: Kyushu Institute of Technology
        position: Principal Postdoctoral Researcher & PI
        location: Fukuoka, Japan
        start_date: "2018-04"
        end_date: "2021-09"
        summary: Served as Principal Investigator for two JSPS KAKEN Grants-in-Aid totaling 4.42M JPY, leading 3+ years of post-doctoral protocol R&D.
        highlights:
          - "Served as Principal Investigator (PI) for two prestigious JSPS KAKEN Grants-in-Aid for IoT reliability and 'self-healing' network projects (Grant IDs: 18H06467 & 20K19785, totaling 4.42M JPY)."
          - "Headed R&D projects to engineer resilient TCP with Network Coding (TCP/NC) transport frameworks and centralized SDN architectures tailored to actively mask lossy transport channels, prevent TCP timeouts, and eliminate tail latency."
          - "Developed high-level software models and discrete-event simulations in C++ and Python to bridge theoretical network capacity algorithms with practical real-time packet processing and buffer management."
          - "Designed and delivered specialized guest lectures on SDN architectures, OpenFlow control mechanisms, Ryu controllers, and Mininet for the City College of New York (CCNY)."

      - company: University of Science
        position: Associate Lecturer, Network Administrator & Faculty Registrar
        location: Ho Chi Minh City, VN
        start_date: "2009-09"
        end_date: "2014-03"
        summary: Conducted physical-layer communication research, administered departmental L2/L3 network infrastructure, and served as Faculty Registrar.
        highlights:
          - "Architected an FPGA-Based 2x2 MIMO-OFDM SDM Transceiver achieving a low-latency 400 Mbps pipeline using custom DSP units and fixed-point arithmetic."
          - "Managed departmental network infrastructure as Administrator, applying hands-on L2/L3 routing (OSPF/BGP), switching, VLAN segmentation, and network security."
          - "Mentored student teams to competitive success, including a 2nd-place national finish in the Cisco NetRiders contest (2013)."
          - "Maintained active certifications as a CCAI (Cisco Certified Academy Instructor) for CCNA/Security and MCSE/MCSA."

    Projects:
      - name: High-Speed Hardware-in-the-Loop (HITL) Link Emulation
        summary: Multi-vendor HITL emulation system bridging Intel Agilex 5 and Xilinx Kintex UltraScale+ FPGAs over HSMC-XTS and PCIe 3.0x4 interfaces.
        start_date: "2026-04"
        end_date: "present"
        highlights:
          - "Architected a heterogeneous hardware-in-the-loop (HITL) emulation system bridging Intel Agilex 5 and AMD Xilinx Kintex UltraScale+ FPGAs over multi-vendor high-speed interfaces."
          - "Utilized a TI LMK62E2 oscillator driving a 156.25 MHz SerDes reference clock to lock transceivers and synchronize physical layer links."
          - "Designed an ultra-wide 1024-bit packet processing datapath operating at 156.25 MHz / 312.5 MHz core clock (up to 320 Gbps internal pipeline capacity) for real-time header parsing, deparsing, and packet filtering."
          - "Engineered host-to-FPGA streaming pipelines via PCIe 3.0x4 DMA, enabling end-to-end packet processing with embedded Network Coding offload logic."

      - name: "Wireless System Emulation: Multi-User AWGN Hardware Generator"
        summary: Real-time embedded AWGN hardware generator supporting multi-rates and multi-users with APB control interface.
        start_date: "2025-09"
        end_date: "2026-02"
        highlights:
          - "Designed 512-bit wide AXI4-Stream datapaths achieving 375MHz+ on Intel Agilex 7 and Xilinx FPGAs to meet strict pre-silicon timing requirements."
          - "Developed control state machines, low-level drivers, and software sweeping SNR from -30 dB to 45 dB with precise real-time configuration."
          - "Facilitated HW/SW co-design via APB master/slave interfaces, providing memory-mapped register access (CSRs) for software validation teams via C drivers."
          - "Automated build flows by authoring custom TCL scripts for project generation, IP synthesis, and pin assignments in Vivado and Quartus."

      - name: Programmable Data Plane (P4) for In-Band Telemetry, AQM & Loss Recovery
        summary: Hop-by-hop packet loss recovery scheme for reliable multicast using P4-enabled switches in ns-3 and Mininet.
        start_date: "2024-01"
        end_date: "2025-01"
        highlights:
          - "Programmed custom P4 datapaths featuring In-Band Network Telemetry (INT) with 8-byte custom headers to track packet arrival jitter, link loss rates, and queue depth in real time."
          - "Engineered a QoS-aware selective recirculation port queue strategy in P4 to buffer multicast packets, enabling localized retransmissions that reduced 1 GB file transfer completion times by 36% across 41 nodes."
          - "Implemented an adaptive queue depth mechanism that dynamically shifts congestion thresholds based on real-time occupancy, cutting packet loss by 59% under 300 Mbps traffic loads and accelerating recovery times by 67%."

      - name: Fault-Tolerant TDMA Framework for LWSNs & Constellation Networks
        summary: Proactive packet loss recovery framework integrating hop-by-hop FEC / Erasure Coding with TDMA scheduling.
        start_date: "2023-10"
        end_date: "2025-09"
        highlights:
          - "Architected a proactive loss recovery framework combining hop-by-hop Erasure Coding with TDMA scheduling for linear sensor topologies, evaluated against reference microcontroller/radio hardware profiles (ARM Cortex-M3 / Atmel AT86RF215)."
          - "Utilized a 1-step Hill Climbing search algorithm to optimize TDMA timeslots in 1.32 ms for 18-node topologies under strict battery energy budgets."
          - "Maintained >99% delivery probability across a 30-node topology under aggressive 50% link-loss environments, ensuring node energy profiles capable of 10-day battery operation."

      - name: Self-Healing Dynamic Routing Protocol for SDN (SDN-FEDRP)
        summary: Dynamic routing protocol on RYU controller leveraging Depth First Search (DFS) path discovery.
        start_date: "2021-01"
        end_date: "2021-12"
        highlights:
          - "Engineered a custom dynamic routing algorithm on the Python-based RYU OpenFlow controller leveraging Depth First Search (DFS) for dynamic path discovery and link cost calculation."
          - "Implemented an automated OpenFlow flow reallocation mechanism governed by a fairness factor to dynamically mitigate congestion."
          - "Achieved a 7x load balancing performance improvement over standard SDN-OSPF in Mininet topology evaluations."

      - name: Resilient Transport Protocol Suite & State Machine Architecture
        summary: Resilient embedded transport layer state machines and custom ACK generator in C++ for ns-3.
        start_date: "2015-03"
        end_date: "2020-03"
        highlights:
          - "Engineered resilient embedded transport layer state machines incorporating Forward Retransmission (FR), Dependence Retransmission (DR), and a 32-bit Packet Loss Sequence (PLS) header field."
          - "Architected a Dynamic ACK-Skipping scheme with ACK Accumulation, Pause-ACK reordering buffers, and a 200 ms Timer-Based ACK Retransmission engine to survive severe reverse-path loss up to 0.4."
          - "Implemented a source-side Duplicate ACK Generator that locally synthesizes proxy DupACKs for fast TCP recovery, sustaining high goodput (70% of link / 70 Mbps) under heavy bi-directional burst conditions while preventing TCP timeouts."
          - "Developed an Adaptive Mid-Window Encoding Matrix that recalculates Network Coding coefficients on-the-fly based on Gilbert loss model estimation (reducing RMSE to 0.74)."

      - name: Transparent Middlebox Overlay Tunneling & AQM Buffer Management
        summary: Encapsulation proxy architecture merging multiple TCP sessions over heterogeneous networks into a single flow.
        start_date: "2017-06"
        end_date: "2019-12"
        highlights:
          - "Formulated a middlebox encapsulation proxy architecture aggregating multiple independent TCP flows across asymmetric links (1--7 Mbps) into a single optimized stream with only ~4% encapsulation overhead."
          - "Achieved zero-touch legacy transparency, requiring zero OS kernel or driver alterations to end-user devices."
          - "Designed a state-based buffer management algorithm applying 4 distinct timeout triggers to purge 'dead packets,' saving memory footprint and preventing mistaken redundancy escalation."

      - name: FPGA-Based MIMO Channel Emulators, Transceivers & Turbo Codes
        summary: Real-time FPGA implementation of MIMO-OFDM STBC/SDM transceivers, 4x4 MU-MIMO channel emulators, and SOVA Turbo Decoders.
        start_date: "2011-09"
        end_date: "2016-11"
        highlights:
          - "Architected a 4x4 MU-MIMO real-time channel emulator in SystemVerilog, optimizing matrix DSP pipelines to reduce Stratix FPGA ALM resource consumption from 16,800% down to 20% while downsampling to 2604 Hz."
          - "Implemented a 2x2 MIMO-OFDM Spatial Division Multiplexing (SDM) baseband transceiver achieving a 147.12 MHz evaluation clock speed on Stratix III FPGAs while consuming <45% dedicated logic registers."
          - "Designed a Parallel Concatenated Convolutional Code (PCCC) Turbo Encoder and Soft Output Viterbi Algorithm (SOVA) decoder on FPGA, optimizing metric updates by tracking a single ML survivor route to reduce computational complexity."
          - "Maintained model-to-silicon arithmetic accuracy by utilizing a 32-bit fixed-point (10.22 format) representation, resulting in a hardware Bit Error Rate (BER) performance that exactly matched software models."

