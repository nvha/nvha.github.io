        level: Expert
        icon: fa-solid fa-microchip
        keywords: "FPGA & ASIC Design, RTL Design, Hardware Emulation, Hardware Verification, Pre/Post-Silicon Validation, HW/SW Co-Design, DSP Algorithms, Packet Processing, FEC Architectures, High-Speed Datapaths, Network Modeling & Simulation, Transport Protocols (TCP/IP, UDP, TCP/NC), Software-Defined Networking (SDN / OpenFlow), Flow & Congestion Control, Active Queue Management (AQM), Packet Loss Masking, Tail-Latency Reduction, Adaptive Routing & Load Balancing, Programmable Data Planes (P4), Traffic Engineering, Fault Tolerance"

